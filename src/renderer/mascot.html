<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: data:;"
    />
    <title>PosturePet</title>
    <!-- El aspecto de los personajes se comparte con la ventana de ajustes,
         que los pinta todos para elegir. mascot.css solo trae lo propio de
         esta ventana: transparencia, arrastre y tamaño. -->
    <link rel="stylesheet" href="./avatar.css" />
    <link rel="stylesheet" href="./mascot.css" />
  </head>
  <body>
    <!-- El cuerpo lo inyecta mascot.mjs desde avatars.mjs: cambiar de
         personaje en ajustes lo repinta sin recargar la ventana.
         Clases: pet + avatar-<id> + state-good|warn|bad|paused|blind -->
    <div id="pet" class="pet state-paused" title="PosturePet"></div>

    <script type="module" src="./mascot.mjs"></script>
  </body>
</html>
