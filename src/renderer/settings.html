<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>PosturePet</title>
    <!-- El mismo CSS que usa la ventana del personaje: la rejilla de selección
         tiene que enseñar exactamente lo que se va a ver luego en pantalla. -->
    <link rel="stylesheet" href="./avatar.css" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <!--
      Ni un solo texto traducible en este archivo: cada uno lleva su clave en
      data-i18n y lo rellena i18n.mjs. Cambiar de idioma es volver a recorrer
      el DOM, sin reconstruir nada ni reiniciar la ventana.
    -->

    <!-- La cabecera no entra en las pestanas: el score y el estado son lo
         unico que importa siempre, se este ajustando lo que se este. -->
    <header>
      <div id="score-ring">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="track" cx="50" cy="50" r="42" />
          <circle id="ring" cx="50" cy="50" r="42" />
        </svg>
        <div id="score-value">--</div>
      </div>
      <div id="header-text">
        <h1>PosturePet</h1>
        <p id="status" data-i18n="status.starting"></p>
        <div class="row">
          <button id="calibrate" class="primary" data-i18n="settings.calibrate"></button>
          <button id="pause" data-i18n="settings.pause"></button>
        </div>
      </div>

      <button id="about-open" data-i18n-title="settings.about.open">
        <span class="info-mark" aria-hidden="true">i</span>
        <span id="about-version"></span>
      </button>
    </header>

    <nav id="tabs" role="tablist" aria-label="PosturePet">
      <button role="tab" id="tab-posture" aria-controls="panel-posture"
              data-i18n="settings.tabs.posture"></button>
      <button role="tab" id="tab-avatar" aria-controls="panel-avatar"
              data-i18n="settings.tabs.avatar"></button>
      <button role="tab" id="tab-alerts" aria-controls="panel-alerts"
              data-i18n="settings.tabs.alerts"></button>
      <button role="tab" id="tab-sensitivity" aria-controls="panel-sensitivity"
              data-i18n="settings.tabs.sensitivity"></button>
      <button role="tab" id="tab-times" aria-controls="panel-times"
              data-i18n="settings.tabs.times"></button>
      <button role="tab" id="tab-camera" aria-controls="panel-camera"
              data-i18n="settings.tabs.camera"></button>
      <button role="tab" id="tab-system" aria-controls="panel-system"
              data-i18n="settings.tabs.system"></button>
    </nav>

    <main>
      <!-- ------------------------------------------------------- POSTURA -->
      <div class="panel" id="panel-posture" role="tabpanel" aria-labelledby="tab-posture">
        <section>
          <h2 data-i18n="settings.profiles.title"></h2>
          <p class="hint" data-i18n="settings.profiles.hint"></p>
          <div id="profiles"></div>

          <!-- Edicion en linea: Electron no implementa window.prompt(). -->
          <form class="row" id="profile-form" hidden>
            <input type="text" id="profile-name" maxlength="40"
                   data-i18n-placeholder="settings.profiles.namePlaceholder" />
            <button type="submit" class="primary" id="profile-save"
                    data-i18n="settings.profiles.save"></button>
            <button type="button" id="profile-cancel"
                    data-i18n="settings.profiles.cancel"></button>
          </form>

          <div class="row" id="profile-actions">
            <button id="add-profile" data-i18n="settings.profiles.add"></button>
            <button id="rename-profile" data-i18n="settings.profiles.rename"></button>
            <button id="delete-profile" data-i18n="settings.profiles.delete"></button>
          </div>
          <p class="note warn" id="stale-note" hidden></p>
        </section>

        <section>
          <h2 data-i18n="settings.live.title"></h2>
          <p class="hint" data-i18n="settings.live.hint"></p>
          <div class="metrics" data-metrics></div>
          <p class="note" id="glance-note" hidden></p>
        </section>
      </div>

      <!-- ------------------------------------------------------ PERSONAJE -->
      <div class="panel" id="panel-avatar" role="tabpanel" aria-labelledby="tab-avatar" hidden>
        <section>
          <h2 data-i18n="settings.avatar.title"></h2>
          <p class="hint" data-i18n="settings.avatar.hint"></p>

          <!--
            Los estados no son decoración: se elige personaje por cómo se ve
            cuando te está riñendo, no por cómo se ve quieto. Pulsar un estado
            lo aplica a los seis a la vez para poder compararlos.
          -->
          <div class="row" id="avatar-states" role="group"
               data-i18n-title="settings.avatar.previewLabel"></div>

          <div id="avatar-grid"></div>
        </section>
      </div>

      <!-- -------------------------------------------------------- AVISOS -->
      <div class="panel" id="panel-alerts" role="tabpanel" aria-labelledby="tab-alerts" hidden>
        <section>
          <div class="section-head">
            <h2 data-i18n="settings.alerts.title"></h2>
            <button class="reset" data-reset="alerts" data-i18n="settings.resetSection"></button>
          </div>
          <p class="hint" data-i18n="settings.alerts.hint"></p>

          <label class="toggle">
            <input type="checkbox" data-alert="tray" />
            <span>
              <strong data-i18n="settings.alerts.tray"></strong>
              <em data-i18n="settings.alerts.trayHint"></em>
            </span>
          </label>
          <label class="toggle">
            <input type="checkbox" data-alert="mascot" />
            <span>
              <strong data-i18n="settings.alerts.mascot"></strong>
              <em data-i18n="settings.alerts.mascotHint"></em>
            </span>
          </label>
          <label class="toggle">
            <input type="checkbox" data-alert="dim" />
            <span>
              <strong data-i18n="settings.alerts.dim"></strong>
              <em data-i18n="settings.alerts.dimHint"></em>
            </span>
          </label>
          <label class="toggle">
            <input type="checkbox" data-alert="toast" />
            <span>
              <strong data-i18n="settings.alerts.toast"></strong>
              <em data-i18n="settings.alerts.toastHint"></em>
            </span>
          </label>
          <label class="toggle">
            <input type="checkbox" data-alert="sound" />
            <span>
              <strong data-i18n="settings.alerts.sound"></strong>
              <em data-i18n="settings.alerts.soundHint"></em>
            </span>
          </label>

          <div class="slider">
            <label for="dimOpacity" data-i18n="settings.alerts.opacity"></label>
            <input type="range" id="dimOpacity" step="0.05" />
            <output id="dimOpacity-out"></output>
          </div>

          <div class="slider">
            <label for="dimFadeIn" data-i18n="settings.alerts.fadeIn"></label>
            <input type="range" id="dimFadeIn" step="100" />
            <output id="dimFadeIn-out"></output>
          </div>
          <p class="hint" data-i18n="settings.alerts.fadeInHint"></p>

          <div class="slider">
            <label for="dimFadeOut" data-i18n="settings.alerts.fadeOut"></label>
            <input type="range" id="dimFadeOut" step="50" />
            <output id="dimFadeOut-out"></output>
          </div>
          <p class="hint" data-i18n="settings.alerts.fadeOutHint"></p>
        </section>

        <section>
          <div class="section-head">
            <h2 data-i18n="settings.sound.title"></h2>
            <button class="reset" data-reset="sound" data-i18n="settings.resetSection"></button>
          </div>
          <p class="hint" data-i18n="settings.sound.hint"></p>

          <div class="slider">
            <label for="soundVolume" data-i18n="settings.sound.volume"></label>
            <input type="range" id="soundVolume" step="0.01" />
            <output id="soundVolume-out"></output>
          </div>

          <div class="slider">
            <label for="soundPitch" data-i18n="settings.sound.pitch"></label>
            <input type="range" id="soundPitch" step="10" />
            <output id="soundPitch-out"></output>
          </div>
          <p class="hint" data-i18n="settings.sound.pitchHint"></p>

          <div class="slider">
            <label for="soundGap" data-i18n="settings.sound.gap"></label>
            <input type="range" id="soundGap" step="10" />
            <output id="soundGap-out"></output>
          </div>

          <div class="slider">
            <label for="soundDecay" data-i18n="settings.sound.decay"></label>
            <input type="range" id="soundDecay" step="10" />
            <output id="soundDecay-out"></output>
          </div>
          <p class="hint" data-i18n="settings.sound.decayHint"></p>

          <div class="row">
            <button id="test-sound" data-i18n="settings.sound.test"></button>
          </div>
        </section>
      </div>

      <!-- -------------------------------------------------- SENSIBILIDAD -->
      <div class="panel" id="panel-sensitivity" role="tabpanel"
           aria-labelledby="tab-sensitivity" hidden>
        <section>
          <div class="section-head">
            <h2 data-i18n="settings.sensitivity.title"></h2>
            <button class="reset" data-reset="sensitivity"
                    data-i18n="settings.resetSection"></button>
          </div>

          <div class="slider">
            <label for="sensitivity" data-i18n="settings.sensitivity.general"></label>
            <input type="range" id="sensitivity" step="0.1" />
            <output id="sensitivity-out"></output>
          </div>
          <p class="hint" data-i18n="settings.sensitivity.generalHint"></p>

          <div class="slider">
            <label for="smoothing" data-i18n="settings.sensitivity.smoothing"></label>
            <input type="range" id="smoothing" step="100" />
            <output id="smoothing-out"></output>
          </div>
          <p class="hint" data-i18n="settings.sensitivity.smoothingHint"></p>

          <div class="slider">
            <label for="enterBad" data-i18n="settings.sensitivity.enterBad"></label>
            <input type="range" id="enterBad" step="1" />
            <output id="enterBad-out"></output>
          </div>

          <div class="slider">
            <label for="exitBad" data-i18n="settings.sensitivity.exitBad"></label>
            <input type="range" id="exitBad" step="1" />
            <output id="exitBad-out"></output>
          </div>
          <p class="hint" data-i18n="settings.sensitivity.hysteresisHint"></p>
        </section>

        <!-- Las mismas barras que en la pestana Postura. Ajustar sensibilidad
             sin verlas reaccionar es ajustar a ciegas, y obligar a cambiar de
             pestana entre cada gesto rompe justo el bucle que hace util el
             panel: mover, mirar, corregir. -->
        <section>
          <h2 data-i18n="settings.live.title"></h2>
          <div class="metrics" data-metrics></div>
        </section>
      </div>

      <!-- ------------------------------------------------------- TIEMPOS -->
      <div class="panel" id="panel-times" role="tabpanel" aria-labelledby="tab-times" hidden>
        <section>
          <div class="section-head">
            <h2 data-i18n="settings.times.title"></h2>
            <button class="reset" data-reset="times" data-i18n="settings.resetSection"></button>
          </div>
          <p class="hint" data-i18n="settings.times.hint"></p>

          <div class="slider">
            <label for="glance" data-i18n="settings.times.glance"></label>
            <input type="range" id="glance" step="5" />
            <output id="glance-out"></output>
          </div>
          <p class="hint" data-i18n="settings.times.glanceHint"></p>

          <div class="slider">
            <label for="dwell" data-i18n="settings.times.dwell"></label>
            <input type="range" id="dwell" step="1" />
            <output id="dwell-out"></output>
          </div>
          <p class="hint" data-i18n="settings.times.dwellHint"></p>

          <div class="slider">
            <label for="cooldown" data-i18n="settings.times.cooldown"></label>
            <input type="range" id="cooldown" step="15" />
            <output id="cooldown-out"></output>
          </div>
          <p class="hint" data-i18n="settings.times.cooldownHint"></p>

          <div class="slider">
            <label for="mascotDelay" data-i18n="settings.times.mascotDelay"></label>
            <input type="range" id="mascotDelay" step="1" />
            <output id="mascotDelay-out"></output>
          </div>

          <div class="slider">
            <label for="away" data-i18n="settings.times.away"></label>
            <input type="range" id="away" step="1" />
            <output id="away-out"></output>
          </div>

          <div class="slider">
            <label for="calibration" data-i18n="settings.times.calibration"></label>
            <input type="range" id="calibration" step="0.5" />
            <output id="calibration-out"></output>
          </div>
          <p class="hint" data-i18n="settings.times.calibrationHint"></p>

          <div class="slider">
            <label for="countdown" data-i18n="settings.times.countdown"></label>
            <input type="range" id="countdown" step="1" />
            <output id="countdown-out"></output>
          </div>
          <p class="hint" data-i18n="settings.times.countdownHint"></p>
        </section>
      </div>

      <!-- -------------------------------------------------------- CAMARA -->
      <div class="panel" id="panel-camera" role="tabpanel" aria-labelledby="tab-camera" hidden>
        <section>
          <div class="section-head">
            <h2 data-i18n="settings.camera.title"></h2>
            <button class="reset" data-reset="camera" data-i18n="settings.resetSection"></button>
          </div>

          <div class="slider">
            <label for="camera" data-i18n="settings.camera.device"></label>
            <select id="camera"></select>
            <output></output>
          </div>
          <p class="hint" data-i18n="settings.camera.hint"></p>

          <div class="slider">
            <label for="interval" data-i18n="settings.camera.interval"></label>
            <input type="range" id="interval" step="50" />
            <output id="interval-out"></output>
          </div>
          <p class="hint" data-i18n="settings.camera.intervalHint"></p>

          <div class="slider">
            <label for="stale" data-i18n="settings.camera.stale"></label>
            <input type="range" id="stale" step="5" />
            <output id="stale-out"></output>
          </div>
          <p class="hint" data-i18n="settings.camera.staleHint"></p>

          <div class="slider">
            <label for="preview" data-i18n="settings.camera.preview"></label>
            <input type="range" id="preview" step="10" />
            <output id="preview-out"></output>
          </div>
          <p class="hint" data-i18n="settings.camera.previewHint"></p>
        </section>
      </div>

      <!-- ------------------------------------------------------- SISTEMA -->
      <div class="panel" id="panel-system" role="tabpanel" aria-labelledby="tab-system" hidden>
        <section>
          <h2 data-i18n="settings.language.title"></h2>
          <div class="slider">
            <label for="locale" data-i18n="settings.language.label"></label>
            <select id="locale"></select>
            <output></output>
          </div>
          <p class="hint" data-i18n="settings.language.hint"></p>
        </section>

        <section>
          <h2 data-i18n="settings.system.title"></h2>
          <label class="toggle">
            <input type="checkbox" id="autostart" />
            <span>
              <strong data-i18n="settings.system.autostart"></strong>
              <em data-i18n="settings.system.autostartHint"></em>
            </span>
          </label>

          <div class="row">
            <button id="reset-all" data-i18n="settings.system.reset"></button>
          </div>
          <p class="hint" data-i18n="settings.system.resetHint"></p>

          <p class="hint" id="privacy" data-i18n="settings.system.privacy"></p>
        </section>
      </div>
    </main>

    <!--
      Capa de calibración. Va dentro de esta ventana y no en una aparte: una
      ventana nueva tendría que repetir el CSP, pelearse por el foco y podría
      quedar tapada justo cuando el usuario está mirando a la cámara.

      El vídeo es un <img> al que llegan fotogramas ya codificados desde la
      ventana del personaje, que es la dueña de la cámara. Un <video> aquí
      estaría bloqueado por el CSP (`default-src 'none'`, sin media-src), y
      abrir un segundo stream se pelearía con el detector por el dispositivo.
    -->
    <div id="calib" hidden>
      <div id="calib-box" role="dialog" aria-modal="true" aria-labelledby="calib-title">
        <h2 id="calib-title" data-i18n="settings.calibration.title"></h2>
        <p class="hint" data-i18n="settings.calibration.intro"></p>

        <div id="calib-stage">
          <img id="calib-video" alt="" />
          <div id="calib-countdown" hidden></div>
          <!-- Barra al pie y no un anillo centrado: durante la captura hay que
               seguir viéndose la cara, que es lo que se está midiendo. -->
          <div id="calib-progress" aria-hidden="true" hidden>
            <div id="calib-bar"></div>
          </div>
        </div>

        <ul id="calib-checks"></ul>

        <p class="note" id="calib-note"></p>

        <div class="row" id="calib-actions">
          <button id="calib-cancel" data-i18n="settings.calibration.cancel"></button>
          <button id="calib-retry" class="primary" data-i18n="settings.calibration.retry" hidden></button>
          <button id="calib-undo" data-i18n="settings.calibration.undo" hidden></button>
        </div>
      </div>
    </div>

    <!--
      Modal de información. El botón de buscar actualización es la única cosa
      de toda la app que toca la red, y la petición no la hace esta ventana: la
      hace el proceso principal, para no tener que abrirle connect-src a nadie
      en el CSP. Ver src/main/updates.js.
    -->
    <div id="about" hidden>
      <div id="about-box" role="dialog" aria-modal="true" aria-labelledby="about-title">
        <h2 id="about-title" data-i18n="settings.about.title"></h2>
        <p class="version" id="about-version-line"></p>

        <p data-i18n="settings.about.what"></p>

        <p class="claim"><strong data-i18n="settings.about.privacy"></strong></p>
        <p class="hint" data-i18n="settings.about.privacyDetail"></p>

        <hr />

        <p data-i18n="settings.about.network"></p>
        <div class="row">
          <button id="about-check" class="primary" data-i18n="settings.about.check"></button>
          <button id="about-download" hidden></button>
        </div>
        <p class="note" id="about-result"></p>
        <p class="hint" data-i18n="settings.about.networkDetail"></p>

        <hr />

        <p class="hint">
          <span data-i18n="settings.about.license"></span>
          <a id="about-repo" href="#" data-i18n="settings.about.repo"></a>
        </p>

        <div class="row">
          <button id="about-close" data-i18n="settings.about.close"></button>
        </div>
      </div>
    </div>

    <script type="module" src="./settings.mjs"></script>
  </body>
</html>
